name: Release Favourite Child

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to upload (e.g. 1.2.1)
        required: true

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: echo "VERSION=${{ github.event.release.tag_name || inputs.version }}" >> "$GITHUB_ENV"

      - name: Package (no git artefacts)
        run: |
          git archive --format=zip --prefix="Favourite Child/" \
            -o "Favourite-Child-${VERSION}.zip" HEAD

      - name: Verify zip contents
        run: |
          unzip -l "Favourite-Child-${VERSION}.zip"
          if unzip -l "Favourite-Child-${VERSION}.zip" | grep -E '\.git|\.github'; then
            echo "Git artefacts found in zip" && exit 1
          fi
          unzip -l "Favourite-Child-${VERSION}.zip" | grep -q 'Favourite Child/Favourite Child.mod' \
            || { echo "Missing Favourite Child.mod" && exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Favourite-Child-${{ env.VERSION }}
          path: Favourite-Child-${{ env.VERSION }}.zip

      - name: Upload to Nexus Mods
        if: ${{ !github.event.release.prerelease }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.8
        with:
          api_key: ${{ secrets.NEXUSMODS_APIKEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: Favourite-Child-${{ env.VERSION }}.zip
          version: ${{ env.VERSION }}
          display_name: Favourite Child ${{ env.VERSION }}
          category: main
          description: ${{ github.event.release.body }}
